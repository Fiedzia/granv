<svg
   width="50mm"
   height="10mm"
   id="{{node.id()}}">
  <g>
    <rect
       style="fill:#c6c7d4;stroke:#d75c5c;"
       width="50mm"
       height="10mm"
       x="0"
       y="0"
       rx="1.4" />
    <text
       style="font-size:10pt;font-family:FreeMono;"
       x="1mm"
       y="50%"
       dominant-baseline="middle"
       >{{node.name()}}</text>
  </g>
</svg>
