<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="50mm"
   height="20mm"
   version="1.1"
   id="{{node.id()}}"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <g>
    <rect
       style="fill:#c6c7d4;stroke:#d75c5c;stroke-width:0.899999"
       width="50"
       height="20"
       x="0"
       y="0"
       rx="1.4" />
    <text
       xml:space="preserve"
       style="font-size:10pt;family:FreeMono;letter-spacing:0px;word-spacing:0px;fill:none;stroke:#000000;stroke-width:0.264583px;stroke-linecap:butt;stroke-linejoin:miter;stroke-opacity:1"
       x="5"
       y="10"
       ><tspan
         x="5"
         y="10">{{node.name()}}</tspan></text>
  </g>
</svg>
